name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# 同一分支的旧构建自动取消，避免重复排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -B: 非交互模式（CI 必须）
      # -ntp: 不打印下载进度，日志干净
      # -Djdk.attach.allowAttachSelf=true: Mockito 内联 mock maker 需要自附加 JVM，
      #   JDK 17 默认禁止，不加会直接报 "Could not initialize plugin: MockMaker"
      - name: Build & Test
        working-directory: backend
        run: >
          mvn -B -ntp -Djdk.attach.allowAttachSelf=true
          clean verify

      # 测试报告即使失败也上传，方便排查
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend · Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # npm run build = 并行跑 type-check (vue-tsc) 和 build-only (vite build)
      - name: Type check & build
        working-directory: frontend
        run: npm run build
