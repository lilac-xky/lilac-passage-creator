name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# 同一分支的旧构建自动取消，避免重复排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # -B: 非交互模式（CI 必须）
      # -ntp: 不打印下载进度，日志干净
      # -Djdk.attach.allowAttachSelf=true: Mockito 内联 mock maker 需要自附加 JVM，
      #   JDK 17 默认禁止，不加会直接报 "Could not initialize plugin: MockMaker"
      #
      # 注意：不需要 MySQL / Redis / 任何外部 API Key。
      # 集成测试走 application-test.yml 的 H2 内存库 + schema-test.sql，
      # 上下文能在无外部依赖的情况下完整启动。
      - name: Build & Test
        working-directory: backend
        run: >
          mvn -B -ntp -Djdk.attach.allowAttachSelf=true
          clean verify

      # 单独报告「建表脚本漂移」——这是不用迁移框架时最大的风险点。
      # schema-test.sql 与 init.sql 不同步时，SchemaDriftTest 会失败，
      # 这条步骤把失败原因提炼出来，方便快速定位。
      - name: Report schema drift (if any)
        if: failure()
        working-directory: backend
        run: |
          if [ -f target/surefire-reports/com.lilac.integration.SchemaDriftTest.txt ]; then
            echo "::error::建表脚本已漂移，请同步 init.sql 与 schema-test.sql"
            cat target/surefire-reports/com.lilac.integration.SchemaDriftTest.txt
          fi

      # 测试报告即使失败也上传，方便排查
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend · Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # vite build 与 vue-tsc 分开跑，便于定位是哪一步挂了。
      # 注意顺序：先 build 再 type-check —— 构建失败是"应用起不来"（阻塞），
      # 类型检查失败是"代码质量"（也想修但不应掩盖构建问题）。
      - name: Build
        working-directory: frontend
        run: npm run build-only

      - name: Type check
        working-directory: frontend
        run: npm run type-check
